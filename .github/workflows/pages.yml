name: Deploy Gather to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Tag Canvas engine
        run: npx --yes --package typescript@5.9.3 tsc --project tsconfig.tag.json
      - name: Validate Tag JavaScript
        run: node --check tag.js && node --check tag-engine.js && node --check service-worker.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish Gather
        id: deployment
        uses: actions/deploy-pages@v4
