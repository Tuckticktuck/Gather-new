name: Validate Gather pull requests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "validate-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check multiplayer Edge Function
        run: deno check supabase/functions/gather-board-game-action/index.ts
      - name: Run deterministic multiplayer tests
        run: node --test tests/*.test.mjs
      - name: Validate JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Validate site assets and UI contracts
        run: node scripts/validate-site.mjs
